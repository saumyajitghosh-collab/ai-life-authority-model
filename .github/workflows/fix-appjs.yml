name: fix-appjs
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch esc helper
        run: |
          python3 - << 'PYEOF'
          codes = [99, 111, 110, 115, 116, 32, 101, 115, 99, 32, 61, 32, 118, 32, 61, 62, 32, 83, 116, 114, 105, 110, 103, 40, 118, 32, 63, 63, 32, 39, 39, 41, 46, 114, 101, 112, 108, 97, 99, 101, 40, 47, 91, 38, 60, 62, 34, 93, 47, 103, 44, 32, 99, 32, 61, 62, 32, 40, 123, 32, 39, 38, 39, 58, 32, 39, 38, 97, 109, 112, 59, 39, 44, 32, 39, 60, 39, 58, 32, 39, 38, 108, 116, 59, 39, 44, 32, 39, 62, 39, 58, 32, 39, 38, 103, 116, 59, 39, 44, 32, 39, 34, 39, 58, 32, 39, 38, 113, 117, 111, 116, 59, 39, 32, 125, 91, 99, 93, 41, 41, 59]
          new_line = ''.join(chr(c) for c in codes) + chr(10)
          p = 'static/app.js'
          with open(p, encoding='utf-8') as f:
              lines = f.readlines()
          if lines[5] == new_line:
              print('already correct')
          else:
              lines[5] = new_line
              with open(p, 'w', encoding='utf-8', newline='') as f:
                  f.writelines(lines)
              print('patched line 6')
          PYEOF
          if git diff --quiet -- static/app.js; then
            echo 'no change needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -q .github/workflows/fix-appjs.yml
            git add static/app.js
            git commit -m 'Restore original esc helper line in app.js'
            git push
          fi
