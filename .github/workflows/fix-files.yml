name: Fix transcription errors
on: [push]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 -c "import pathlib; p=pathlib.Path('LICENSE'); t=p.read_text(); t=t.replace('NONINDRINGEMENT','NONINFRINGEMENT'); p.write_text(t)"
          python3 -c "import pathlib; q=chr(34); a=chr(42); p=pathlib.Path('README.md'); t=p.read_text(); t=t.replace('actions'+q+q+' the','actions'+q+' the').replace('owner'+a+', not','owner'+a+a+', not'); p.write_text(t)"
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE README.md
          git commit -m "Restore exact LICENSE and README content" || echo "nothing to commit"
          git rm .github/workflows/fix-files.yml
          git commit -m "Remove fix workflow" || echo "workflow already removed"
          git push
